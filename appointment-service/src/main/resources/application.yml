spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${POSTGRES_DB:appointment_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    base-url: ${AUTH_SERVICE_URL:https://localhost:9443}
    key-store: ${AUTH_MTLS_KEYSTORE:file:../.mtls/appointment-client.p12}
    key-store-password: ${AUTH_MTLS_KEYSTORE_PASSWORD:changeit}
    trust-store: ${AUTH_MTLS_TRUSTSTORE:file:../.mtls/ca-truststore.p12}
    trust-store-password: ${AUTH_MTLS_TRUSTSTORE_PASSWORD:changeit}
  rabbitmq:
    appointment-exchange: ${RABBITMQ_EXCHANGE:appointment.exchange}
    history-routing-key: ${RABBITMQ_HISTORY_ROUTING_KEY:history.created}
    notification-routing-key: ${RABBITMQ_NOTIFICATION_ROUTING_KEY:notification.created}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

security:
  jwt:
    issuer: ${JWT_ISSUER:auth-service}
    # No Docker vem de JWT_PUBLIC_KEY=file:/keys/app.sub; pela IDE, da pasta .jwt-keys da raiz.
    public-key: ${JWT_PUBLIC_KEY:file:../.jwt-keys/app.sub}
